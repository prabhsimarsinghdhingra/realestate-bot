<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DarGlobal &amp; Wasalt Assistant</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--fg:#1c1c1c;--muted:#6b6b6b;--acc:#1f4d3a;--user:#1f4d3a;--userfg:#fff;--bot:#ecebe6}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--fg:#eee;--muted:#999;--acc:#4fae8a;--user:#2d6b53;--bot:#2a2a2a}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:760px;padding:16px}h1{margin:0;font-size:20px}header p{margin:4px 0 0;color:var(--muted);font-size:14px}
#log{flex:1;width:100%;max-width:760px;overflow-y:auto;padding:0 16px}
.m{max-width:85%;padding:10px 14px;border-radius:14px;margin:8px 0;white-space:pre-wrap;line-height:1.45}
.u{background:var(--user);color:var(--userfg);margin-left:auto}.b{background:var(--bot)}
.src{font-size:12px;color:var(--muted);margin-top:6px}.src a{color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px;max-width:760px;width:100%}
.chips button{border:1px solid var(--acc);background:none;color:var(--acc);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px}
form{display:flex;gap:8px;width:100%;max-width:760px;padding:12px 16px 20px}
input{flex:1;padding:12px;border-radius:10px;border:1px solid #8884;background:var(--card);color:var(--fg);font-size:16px}
form button{padding:0 20px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:16px;cursor:pointer}
</style></head><body>
<header><h1>DarGlobal &amp; Wasalt Assistant</h1><p>Ask about projects, partnerships, and services. Answers come from scraped public data.</p></header>
<div class="chips" id="chips"></div>
<div id="log"></div>
<form id="f"><input id="q" placeholder="e.g. Who owns Wasalt?" autocomplete="off" required><button>Send</button></form>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),f=document.getElementById('f'),chips=document.getElementById('chips');let hist=[];
["Who founded Wasalt?","What projects does Dar Global have in Dubai?","Tell me about Trump Tower Jeddah","Which brands does Dar Global partner with?"]
.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{q.value=t;f.requestSubmit()};chips.appendChild(b)});
function add(cls,text,sources){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;
 if(sources&&sources.length){const s=document.createElement('div');s.className='src';s.append('Sources: ');
  const n=Math.min(sources.length,4);sources.slice(0,n).forEach((x,i)=>{const a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener';a.textContent=x.source+' ('+(x.title||'link').slice(0,30)+')';s.append(a);if(i<n-1)s.append(' · ')});d.append(s)}
 log.append(d);log.scrollTop=log.scrollHeight;return d}
f.onsubmit=async e=>{e.preventDefault();const m=q.value.trim();if(!m)return;q.value='';add('u',m);const w=add('b','Thinking…');
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,history:hist})});
  const j=await r.json();w.remove();add('b',j.answer,j.sources);hist.push({role:'user',content:m},{role:'assistant',content:j.answer})}
 catch(err){w.textContent='Network error, please try again.'}};
</script></body></html>
